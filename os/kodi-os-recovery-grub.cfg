# Included by the Kodi OS GRUB configuration hook.
# Recovery is opt-in: the normal boot remains unchanged.
menuentry 'Kodi OS Recovery' --class kodi --class gnu-linux --class os {
    insmod part_gpt
    insmod ext2
    search --no-floppy --file --set=root /boot/vmlinuz
    linux /boot/vmlinuz boot=live components recovery=1 systemd.unit=kodi-os.target
    initrd /boot/initrd.img
}

menuentry 'Kodi OS Recovery (diagnostics)' --class kodi --class gnu-linux --class os {
    insmod part_gpt
    insmod ext2
    search --no-floppy --file --set=root /boot/vmlinuz
    linux /boot/vmlinuz boot=live components recovery=1 systemd.unit=kodi-os.target loglevel=7
    initrd /boot/initrd.img
}
